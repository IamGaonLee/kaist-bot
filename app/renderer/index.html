<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>KAISTBOT</title>
  <style>
    :root { --bg: #f7f8fa; --fg: #1a1a1a; --sub: #666; --accent: #1a56b0; --card: #fff; --line: #e3e6ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1f24; --fg: #e8eaed; --sub: #9aa0a6; --accent: #6ea8ff; --card: #262a30; --line: #363b42; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    header .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    header h1 { font-size: 15px; margin: 0; }
    header .ver { font-size: 11px; color: var(--sub); }
    main { padding: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .muted { color: var(--sub); font-size: 13px; }
    #status { margin-top: 10px; font-size: 13px; min-height: 18px; color: var(--sub); white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <div class="logo">K</div>
    <div>
      <h1>KAISTBOT</h1>
      <div class="ver" id="ver"></div>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="muted">앱이 실행 중입니다. 로그인·동기화는 다음 단계에서 붙습니다.</div>
      <div id="status"></div>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
